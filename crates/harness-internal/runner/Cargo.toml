[package]
name = "harness-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Runtime-agnostic async: the effect loop's in-flight set
# (`FuturesUnordered` of `Abortable` futures under `catch_unwind`), the
# stop flag's `AtomicWaker`, and the race between a model listing and
# the run's cancel.
futures-util.workspace = true
# The `PluginReport` that a `Host` keeps for each Plugin its builder
# names, the functions that load a Plugin of the C contract, the
# `HostResources` those Plugins are offered, and the function that makes
# the report of a Rust Plugin.
harness-plugin-loader.workspace = true
# The Plugin contract: the registry a Host's Plugins fill, the `PackInfo`
# values it holds, the Pack objects they build, and the context each call
# is lent.
runvil-plugin.workspace = true
# The Engine's public API: the Run this crate drives, the effects and
# answers it correlates, and the run's VFS handle.
runvil-engine.workspace = true
# The type of an entry point of the C contract, which the builder of a
# `Host` takes for a Plugin that is linked into the Host.
runvil-plugin-sys.workspace = true
# The run seed's 32 bytes are drawn from the OS CSPRNG at preparation: it
# is the untrusted-envelope nonce's source, so it must be unguessable.
rand.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# The `display_chain` tests derive the source chains they render.
thiserror.workspace = true
# The suites drive runs on tokio's test runtime, pace performers with its
# clock, and gate them with its semaphore and channels.
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
