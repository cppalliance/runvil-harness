[package]
name = "harness-gateway-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The one crate a Host depends on: the `InferenceBroker` trait the
# Gateway broker implements, with its boxed future, the chat vocabulary
# (Message, ToolSchema, Completion) and the universal error the
# conversions build through the Engine's public constructors, the
# canonical metrics and model catalog vocabulary, and the `HostResources`
# in which a Host offers the Gateway to its Plugins.
runvil.workspace = true
# The HTTP client, from its own repository, pinned by commit. This crate
# converts its plain types to the Engine's.
gateway-client.workspace = true
# Derives the wire shape of the llama.cpp `timings` section in `metrics.rs`.
serde.workspace = true
# The metrics sections, the error facts, and the entry that offers the
# Gateway to a Host's Plugins are JSON.
serde_json.workspace = true
# The sleeps of `TokioTimer`. Non-test code spawns no task.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
# The mock gateways the broker tests send real rounds to.
axum.workspace = true
# The live test reads the Gateway's `/admin/config` settings, which the
# client does not fetch.
reqwest.workspace = true
# The Engine's stepping items: the request tests step a real run to get
# a system message and an assistant tool-call message, which have no
# public constructor.
runvil-engine.workspace = true
# The raw-socket mocks write truncated responses by hand, and the timer's
# tests pause tokio's clock.
tokio = { workspace = true, features = ["io-util", "test-util"] }

[lints]
workspace = true
